version: '3.8'

services:
  app:
    build: .
    container_name: revenue-intelligence-app
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/revenue_intelligence
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    restart: unless-stopped
    networks:
      - revenue-network

  db:
    image: postgres:15-alpine
    container_name: revenue-intelligence-db
    environment:
      - POSTGRES_DB=revenue_intelligence
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - revenue-network

volumes:
  postgres_data:
    driver: local

networks:
  revenue-network:
    driver: bridge
